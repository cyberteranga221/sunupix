version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    open-pull-requests-limit: 5
    groups:
      # Une seule PR par semaine pour les mises à jour mineures et correctives.
      dependances:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
