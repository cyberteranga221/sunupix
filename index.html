<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" />
    <title>SunuPix — Convertir HEIC en JPG ou PNG, gratuit et sans upload</title>
    <meta
      name="description"
      content="Convertis des centaines de photos HEIC (iPhone) en JPG ou PNG, gratuitement. Aucune photo envoyée : tout se fait dans ton navigateur."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sunupix:theme');
          if (t !== 'light' && t !== 'dark')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
